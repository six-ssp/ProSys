name: ProSys

channels:
  - pytorch
  - conda-forge

dependencies:
  - python>=3.9,<3.12
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - scipy>=1.10
  - scikit-learn>=1.2
  - rdkit>=2023.03
  - pytorch>=2.0
  - torchvision>=0.15
  - tqdm>=4.60
  - openpyxl>=3.1
  - tensorboardX>=2.6
  - seaborn>=0.12
  - pip:
    - typed-argument-parser>=1.7
    - prettytable>=3.0
    - wandb>=0.15
    - pubchempy>=1.0
    - molvs>=0.1
    - chemspipy>=2.0
    - rxnmapper>=0.3
    - dgl>=1.1
    # optional: xgboost (has sklearn fallback if absent)
    # optional: python-docx (for paper draft generation)
    # optional: umap-learn (for embedding visualization)
